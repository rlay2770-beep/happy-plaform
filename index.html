<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Platform V4.0</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body { background:#0f172a; color:#f8fafc; font-family:sans-serif; margin:0; padding:0; padding-bottom:70px; }
.header { background:#1e293b; padding:15px; text-align:center; font-weight:bold; font-size:20px; border-bottom:1px solid #334155; position:sticky; top:0; z-index:50; }
.container { max-width:480px; margin:auto; padding:12px; box-sizing:border-box; }
.page { display:none; }
.page.active { display:block; }

/* 📱 Bottom Nav Bar (၄ ခု ဖြစ်သွားပြီ) */
.nav-bar { position:fixed; bottom:0; left:0; right:0; background:#1e293b; display:flex; justify-content:space-around; border-top:1px solid #334155; padding:10px 0; z-index:100; max-width:480px; margin:auto; }
.nav-item { color:#94a3b8; cursor:pointer; font-size:12px; text-align:center; flex:1; background:none; border:none; outline:none; font-weight:bold; }
.nav-item.active { color:#38bdf8; }
.nav-item span { display:block; font-size:20px; margin-bottom:2px; }

/* 📰 Feed & Upload UI */
.create-post { background:#1e293b; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #334155; }
textarea { width:100%; height:70px; background:#0f172a; color:white; border:1px solid #334155; border-radius:8px; padding:10px; box-sizing:border-box; resize:none; outline:none; }
button { background:#38bdf8; color:#0f172a; font-weight:bold; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; margin-top:8px; }
.media-btns { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.media-btns button { font-size:11px; padding:6px 10px; }

.post-card { background:#1e293b; border:1px solid #334155; padding:15px; border-radius:12px; margin-bottom:12px; box-shadow:0 4px 6px rgba(0,0,0,0.2); }
.post-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.post-avatar { width:38px; height:38px; border-radius:50%; object-fit:cover; background:#475569; }
.post-author { font-weight:bold; color:#f1f5f9; font-size:14px; }
.post-time { font-size:11px; color:#64748b; }
.post-img, .post-vid { width:100%; border-radius:8px; margin-top:10px; max-height:280px; object-fit:cover; background:#000; }
.post-aud { width:100%; margin-top:10px; }
.post-actions { margin-top:10px; border-top:1px solid #334155; padding-top:8px; }
.like-btn { background:none; color:#cbd5e1; padding:5px; font-size:13px; }

/* 💬 Comment & Private Chat */
.comment-box { background:#0f172a; padding:8px; border-radius:8px; margin-top:8px; font-size:13px; }
.comment-item { padding:4px 0; border-bottom:1px solid #1e293b; }
.c-user { font-weight:bold; color:#f59e0b; }
.c-input-area { display:flex; margin-top:5px; }
.c-input-area input { flex:1; background:#1e293b; color:white; border:1px solid #334155; padding:6px; border-radius:4px 0 0 4px; outline:none; }
.c-input-area button { margin:0; padding:6px 12px; border-radius:0 4px 4px 0; }
.auth-box { background:#1e293b; padding:20px; border-radius:15px; margin-top:40px; border:1px solid #334155; }
.auth-box input { width:100%; padding:12px; margin:8px 0; background:#0f172a; color:white; border:1px solid #334155; border-radius:8px; box-sizing:border-box; outline:none; }
.profile-card { background:#1e293b; padding:20px; border-radius:12px; text-align:center; border:1px solid #334155; }
.p-photo { width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid #38bdf8; margin:auto; display:block; background:#fff; }
.u-item { display:flex; align-items:center; padding:10px; background:#1e293b; margin-bottom:8px; border-radius:8px; }
.chat-window { display:none; position:fixed; top:55px; bottom:60px; left:0; right:0; background:#0f172a; max-width:480px; margin:auto; z-index:80; flex-direction:column; }
.chat-msgs { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.bubble { padding:8px 12px; border-radius:12px; max-width:75%; word-break:break-all; font-size:14px; }
.me { background:#0284c7; align-self:flex-end; }
.other { background:#334155; align-self:flex-start; }

/* 📺 Watch (TikTok Style Reels View) */
.watch-container { display:flex; flex-direction:column; gap:15px; }
.watch-card { background:#000; border-radius:12px; overflow:hidden; position:relative; border:1px solid #334155; }
.watch-info { position:absolute; bottom:15px; left:15px; right:15px; z-index:10; background:rgba(0,0,0,0.6); padding:10px; border-radius:8px; }
</style>
</head>
<body>

<div class="header">🚀 Happy Platform v4.0</div>

<div class="container">
    <!-- 🔑 Auth Page -->
    <div id="authPage" class="auth-box">
        <h3>Welcome</h3>
        <input id="username" type="text" placeholder="Username">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button style="width:100%;" onclick="registerUser()">အကောင့်အသစ်ဖွင့်မည်</button>
        <button style="width:100%; background:#475569; color:white;" onclick="loginUser()">Login ဝင်မည်</button>
    </div>

    <!-- 📰 Feed Page (ဓာတ်ပုံ၊ သီချင်း၊ ဗီဒီယို အစုံကြည့်ရန်) -->
    <div id="feedPage" class="page">
        <div class="create-post">
            <textarea id="postText" placeholder="ယနေ့အတွက် ဘာတွေးနေလဲ..."></textarea>
            
            <div class="media-btns">
                <button style="background:#475569; color:white;" onclick="document.getElementById('postPhotoInput').click()">📷 ဓာတ်ပုံ</button>
                <button style="background:#eab308; color:#0f172a;" onclick="document.getElementById('postAudioInput').click()">🎵 သီချင်း/အသံ</button>
                <button style="background:#ef4444; color:white;" onclick="document.getElementById('postVideoInput').click()">📺 ဗီဒီယိုတင်ရန်</button>
            </div>

            <!-- Hidden Inputs -->
            <input type="file" id="postPhotoInput" style="display:none;" accept="image/*">
            <input type="file" id="postAudioInput" style="display:none;" accept="audio/*">
            <input type="file" id="postVideoInput" style="display:none;" accept="video/*">
            
            <div id="uploadStatus" style="font-size:12px; color:#38bdf8; margin-top:5px; display:none;">ဖိုင်ကို ချုံ့နေပါသည်... ခေတ္တစောင့်ပါ ⏳</div>
            <button style="width:100%; margin-top:10px;" onclick="createPost()">Post တင်မည် 🚀</button>
        </div>
        <div id="feedPosts">Loading posts...</div>
    </div>

    <!-- 📺 Watch Page (ဗီဒီယို သီးသန့်ကြည့်ရန် နေရာသစ်) -->
    <div id="watchPage" class="page">
        <h3>📺 Popular Videos (Reels)</h3>
        <div id="watchVideos" class="watch-container">No videos yet.</div>
    </div>

    <!-- 💬 Chat List Page -->
    <div id="chatPage" class="page">
        <h3>👥 အဖွဲ့ဝင်များနှင့် စကားပြောရန်</h3>
        <div id="usersOnlineList">Loading users...</div>
    </div>

    <!-- 👤 Profile Page -->
    <div id="profilePage" class="page">
        <div class="profile-card">
            <img id="profileImage" class="p-photo" src="https://via.placeholder.com/100">
            <input type="file" id="photoInput" style="display:none;" accept="image/*">
            <button style="background:#475569; color:white; padding:6px 12px; font-size:12px;" onclick="document.getElementById('photoInput').click()">📷 ပုံပြောင်းရန်</button>
            <h2 id="profileName">-</h2>
            <p id="profileEmail" style="color:#64748b;">-</p>
            <p id="profileBio">-</p>
            <input id="newBio" placeholder="Bio အသစ်ပြင်ရန်" style="width:80%; padding:8px; background:#0f172a; color:white; border:1px solid #334155; border-radius:6px;">
            <button onclick="updateProfile()">Update Profile</button>
            <button style="background:#ef4444; color:white; width:80%; margin-top:15px;" onclick="logoutUser()">Logout ထွက်မည်</button>
        </div>
    </div>
</div>

<!-- 💬 Private Chat Sub-window -->
<div id="chatWindow" class="chat-window">
    <div style="background:#1e293b; padding:12px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
        <span id="chatTitle">Chat</span>
        <button style="margin:0; padding:4px 10px; background:#ef4444; color:white;" onclick="closeChatWindow()">ပိတ်မည်</button>
    </div>
    <div class="chat-msgs" id="chatMessages"></div>
    <div style="display:flex; padding:8px; background:#1e293b;">
        <input id="chatInput" style="flex:1; padding:10px; border-radius:6px 0 0 6px; border:none; outline:none;" placeholder="စာရိုက်ပါ...">
        <button style="margin:0; border-radius:0 6px 6px 0;" onclick="sendMessage()">ပို့မည်</button>
    </div>
</div>

<!-- 📱 Tabs Menu Navigation (၄ ခု ဖြစ်သွားပြီ) -->
<div id="navBar" class="nav-bar" style="display:none;">
    <button id="tab-feed" class="nav-item active" onclick="switchPage('feed')"><span>📰</span>Feed</button>
    <button id="tab-watch" class="nav-item" onclick="switchPage('watch')"><span>📺</span>Watch</button>
    <button id="tab-chat" class="nav-item" onclick="switchPage('chat')"><span>💬</span>Chat</button>
    <button id="tab-profile" class="nav-item" onclick="switchPage('profile')"><span>👤</span>Profile</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCgamnl5ZozPJpPJ5hzbpgGeYm-hXdl8Ug",
    authDomain: "happy-platform-eb6c1.firebaseapp.com",
    projectId: "happy-platform-eb6c1",
    appId: "1:989734830184:web:69a30b6f84643c14303bdd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let base64Image = "", postBase64Image = "", postBase64Audio = "", postBase64Video = "", currentUserData = null;
let currentChatTargetUid = null, chatUnsubscribe = null, usersListUnsubscribe = null, postsUnsubscribe = null;

// စာမျက်နှာ ကူးပြောင်းခြင်း စနစ်
function switchPage(pageName) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    let activePage = document.getElementById(pageName + 'Page');
    if(activePage) activePage.classList.add('active');
    
    let activeTab = document.getElementById('tab-' + pageName);
    if(activeTab) activeTab.classList.add('active');
    if(pageName !== 'chat') closeChatWindow();
}

// ဖိုင်များ ရွေးချယ်ခြင်းနှင့် Base64 ပြောင်းလဲခြင်း စနစ်များ
document.getElementById("photoInput").addEventListener("change", e => {
    compressImg(e.target.files[0], base64 => { base64Image = base64; document.getElementById("profileImage").src = base64; });
});

document.getElementById("postPhotoInput").addEventListener("change", e => {
    showLoading(true);
    compressImg(e.target.files[0], base64 => { 
        postBase64Image = base64; 
        let pre = document.getElementById("postImagePreview"); 
        pre.src = base64; pre.style.display = "block"; 
        showLoading(false);
    });
});

document.getElementById("postAudioInput").addEventListener("change", e => {
    showLoading(true);
    fileToBase64(e.target.files[0], base64 => {
        postBase64Audio = base64;
        alert("🎵 သီချင်းဖိုင် ထည့်သွင်းပြီးပါပြီ။");
        showLoading(false);
    });
});

document.getElementById("postVideoInput").addEventListener("change", e => {
    showLoading(true);
    fileToBase64(e.target.files[0], base64 => {
        postBase64Video = base64;
        alert("📺 ဗီဒီယိုဖိုင် ထည့်သွင်းပြီးပါပြီ (ဖိုင်အတိုလေးများသာ စမ်းသပ်ပါရန်)");
        showLoading(false);
    });
});

function showLoading(show) {
    document.getElementById("uploadStatus").style.display = show ? "block" : "none";
}

// Image Compressor
function compressImg(file, callback) {
    if(!file) return;
    let r = new FileReader(); r.onload = ev => {
        let img = new Image(); img.onload = () => {
            let cv = document.createElement('canvas'); let ctx = cv.getContext('2d');
            cv.width = 300; cv.height = 300; ctx.drawImage(img, 0, 0, 300, 300);
            callback(cv.toDataURL('image/jpeg', 0.4));
        }; img.src = ev.target.result;
    }; r.readAsDataURL(file);
}

// Audio/Video Base64 Converter
function fileToBase64(file, callback) {
    if(!file) return;
    let r = new FileReader();
    r.onload = ev => { callback(ev.target.result); };
    r.readAsDataURL(file);
}

// အကောင့်ဖွင့်/ဝင် စနစ်
function registerUser(){
    let name = document.getElementById("username").value.trim(), email = document.getElementById("email").value.trim(), pass = document.getElementById("password").value;
    if(!name || !email || !pass) return alert("ဖြည့်စွက်ပါ");
    firebase.auth().createUserWithEmailAndPassword(email, pass).then(cred => {
        return db.collection("users").doc(cred.user.uid).set({ email, username: name, bio: "Hello", photoURL: "", createdAt: new Date().toISOString(), status: "online" });
    }).catch(e => alert(e.message));
}
function loginUser(){
    let email = document.getElementById("email").value.trim(), pass = document.getElementById("password").value;
    firebase.auth().signInWithEmailAndPassword(email, pass).then(cred => {
        db.collection("users").doc(cred.user.uid).update({ status: "online" });
    }).catch(e => alert(e.message));
}
function logoutUser(){
    let u = firebase.auth().currentUser;
    if(u) db.collection("users").doc(u.uid).update({ status: "offline" }).then(() => firebase.auth().signOut().then(() => window.location.reload()));
}
function updateProfile(){
    let u = firebase.auth().currentUser; if(!u) return;
    let bio = document.getElementById("newBio").value.trim(), up = {};
    if(bio) up["bio"] = bio; if(base64Image) up["photoURL"] = base64Image;
    if(Object.keys(up).length > 0) db.collection("users").doc(u.uid).update(up).then(() => { alert("ပြင်ဆင်ပြီးပါပြီ"); document.getElementById("newBio").value=""; });
}

// အမြဲတမ်း စောင့်ကြည့်နားထောင်သူ
firebase.auth().onAuthStateChanged(user => {
    if(user){
        document.getElementById("authPage").style.display = "none";
        document.getElementById("navBar").style.display = "flex";
        switchPage('feed');
        db.collection("users").doc(user.uid).onSnapshot(doc => {
            if(doc.exists){
                currentUserData = doc.data(); currentUserData.uid = user.uid;
                document.getElementById("profileName").innerHTML = currentUserData.username;
                document.getElementById("profileEmail").innerHTML = currentUserData.email;
                document.getElementById("profileBio").innerHTML = currentUserData.bio;
                if(currentUserData.photoURL) document.getElementById("profileImage").src = currentUserData.photoURL;
            }
        });
        listenUsers(); listenPosts();
    } else {
        document.getElementById("authPage").style.display = "block";
        document.getElementById("navBar").style.display = "none";
    }
});

function listenUsers() {
    usersListUnsubscribe = db.collection("users").onSnapshot(snap => {
        let div = document.getElementById("usersOnlineList"); div.innerHTML = "";
        snap.forEach(doc => {
            let d = doc.data(); if(currentUserData && doc.id === currentUserData.uid) return;
            let item = document.createElement("div"); item.className = "u-item";
            item.onclick = () => openChatWindow(d.username, doc.id);
            item.innerHTML = `<img src="${d.photoURL || 'https://via.placeholder.com/40'}" style="width:35px; height:35px; border-radius:50%; object-fit:cover; margin-right:10px;">
                              <span>${d.username} (${d.status || 'offline'})</span>`;
            div.appendChild(item);
        });
    });
}

// ပို့စ်အသစ်တင်ခြင်း (စာ၊ ဓာတ်ပုံ၊ သီချင်း၊ ဗီဒီယို)
function createPost(){
    let txt = document.getElementById("postText").value.trim();
    if(!txt && !postBase64Image && !postBase64Audio && !postBase64Video) return;
    
    db.collection("posts").add({
        authorName: currentUserData.username, 
        authorUid: currentUserData.uid, 
        authorPhoto: currentUserData.photoURL || "",
        text: txt, 
        imageURL: postBase64Image, 
        audioURL: postBase64Audio,
        videoURL: postBase64Video,
        likes: [], 
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => { 
        document.getElementById("postText").value = ""; 
        postBase64Image = ""; postBase64Audio = ""; postBase64Video = "";
        document.getElementById("postImagePreview").style.display = "none";
    }).catch(e => {
        alert("ပို့စ်တင်မရပါ (ဖိုင်အရွယ်အစား ၁ မက်ဂါဘိုက်ထက် ကြီးနေခြင်းဖြစ်နိုင်ပါသည်)");
    });
}

// ပင်မ Feed နှင့် Watch (ဗီဒီယို) များကို Real-time ဖတ်ခြင်း
function listenPosts(){
    postsUnsubscribe = db.collection("posts").orderBy("timestamp", "desc").onSnapshot(snap => {
        let feed = document.getElementById("feedPosts"); feed.innerHTML = "";
        let watch = document.getElementById("watchVideos"); watch.innerHTML = "";
        
        snap.forEach(doc => {
            let p = doc.data(); let pid = doc.id;
            let time = p.timestamp ? new Date(p.timestamp.toDate()).toLocaleString() : "ခုနက";
            let isL = p.likes && p.likes.includes(currentUserData.uid);
            
            // 📰 Feed Card တည်ဆောက်ခြင်း
            let card = document.createElement("div"); card.className = "post-card";
            card.innerHTML = `
                <div class="post-header">
                    <img class="post-avatar" src="${p.authorPhoto || 'https://via.placeholder.com/40'}">
                    <div><div class="post-author">${p.authorName}</div><div class="post-time">${time}</div></div>
                </div>
                <div style="font-size:15px; line-height:1.4; white-space:pre-wrap;">${p.text}</div>
                ${p.imageURL ? `<img class="post-img" src="${p.imageURL}">` : ""}
                ${p.audioURL ? `<audio class="post-aud" controls src="${p.audioURL}"></audio>` : ""}
                ${p.videoURL ? `<video class="post-vid" controls src="${p.videoURL}"></video>` : ""}
                <div class="post-actions">
                    <button class="like-btn" onclick="likePost('${pid}')">${isL ? '❤️' : '🤍'} Like (${p.likes ? p.likes.length : 0})</button>
                </div>
                <div class="comment-box" id="c-box-${pid}">Loading...</div>
                <div class="c-input-area">
                    <input id="c-in-${pid}" placeholder="Comment ရေးရန်...">
                    <button onclick="addComment('${pid}')">ပို့</button>
                </div>`;
            feed.appendChild(card); 
            listenComments(pid);

            // 📺 Watch (ဗီဒီယိုသီးသန့် Feed) ထဲသို့ ဗီဒီယိုပါသော ပို့စ်များကို ထည့်သွင်းခြင်း
            if(p.videoURL) {
                let watchCard = document.createElement("div"); watchCard.className = "watch-card";
                watchCard.innerHTML = `
                    <video class="post-vid" style="max-height:400px;" controls src="${p.videoURL}"></video>
                    <div class="watch-info">
                        <div style="font-weight:bold; font-size:14px; margin-bottom:5px;">@${p.authorName}</div>
                        <div style="font-size:12px; max-height:40px; overflow:hidden;">${p.text}</div>
                    </div>`;
                watch.appendChild(watchCard);
            }
        });
        if(watch.innerHTML === "") watch.innerHTML = "တင်ထားသော ဗီဒီယိုများ မရှိသေးပါဗျာ။";
    });
}

function likePost(pid){
    let ref = db.collection("posts").doc(pid);
    db.runTransaction(t => t.get(ref).then(doc => {
        let l = doc.data().likes || [];
        l = l.includes(currentUserData.uid) ? l.filter(id => id !== currentUserData.uid) : [...l, currentUserData.uid];
        t.update(ref, { likes: l });
    }));
}
function addComment(pid){
    let input = document.getElementById(`c-in-${pid}`); if(!input.value.trim()) return;
    db.collection("posts").doc(pid).collection("comments").add({ authorName: currentUserData.username, text: input.value.trim(), timestamp: firebase.firestore.FieldValue.serverTimestamp() }).then(() => input.value = "");
}
function listenComments(pid){
    db.collection("posts").doc(pid).collection("comments").orderBy("timestamp", "asc").onSnapshot(snap => {
        let box = document.getElementById(`c-box-${pid}`); box.innerHTML = "";
        if(snap.empty) return box.style.display = "none"; box.style.display = "block";
        snap.forEach(doc => { let c = doc.data(); let d = document.createElement("div"); d.className="comment-item"; d.innerHTML=`<span class="c-user">${c.authorName}:</span> ${c.text}`; box.appendChild(d); });
    });
}

// သီးသန့် Chat စနစ်
function openChatWindow(name, uid){
    currentChatTargetUid = uid; document.getElementById("chatTitle").innerHTML = "💬 Chat with " + name;
    document.getElementById("chatWindow").style.display = "flex"; listenMessages();
}
function closeChatWindow(){ document.getElementById("chatWindow").style.display = "none"; if(chatUnsubscribe) chatUnsubscribe(); }
function sendMessage(){
    let input = document.getElementById("chatInput"); if(!input.value.trim()) return;
    let rID = currentUserData.uid < currentChatTargetUid ? `${currentUserData.uid}_${currentChatTargetUid}` : `${currentChatTargetUid}_${currentUserData.uid}`;
    db.collection("private_rooms").doc(rID).collection("messages").add({ text: input.value.trim(), senderUid: currentUserData.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() }).then(() => input.value = "");
}
function listenMessages(){
    if(chatUnsubscribe) chatUnsubscribe();
    let rID = currentUserData.uid < currentChatTargetUid ? `${currentUserData.uid}_${currentChatTargetUid}` : `${currentChatTargetUid}_${currentUserData.uid}`;
    chatUnsubscribe = db.collection("private_rooms").doc(rID).collection("messages").orderBy("timestamp", "asc").limitToLast(20).onSnapshot(snap => {
        let box = document.getElementById("chatMessages"); box.innerHTML = "";
        snap.forEach(doc => {
            let m = doc.data(); let me = m.senderUid === currentUserData.uid;
            let b = document.createElement("div"); b.className = `bubble ${me ? 'me' : 'other'}`; b.innerText = m.text; box.appendChild(b);
        });
        box.scrollTop = box.scrollHeight;
    });
}
</script>
</body>
</html>
